<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Idea Dealer Robot Voice</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #14030f;
      background-image: linear-gradient(rgba(20, 3, 15, 0.45), rgba(20, 3, 15, 0.85)), url("images.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff8dc;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    main {
      width: min(620px, 100%);
      display: grid;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
    }

    p {
      margin: 0;
      line-height: 1.5;
    }

    #idea {
      min-height: 96px;
      padding: 18px;
      border: 2px solid #ffd166;
      border-radius: 8px;
      background: #300018;
      box-shadow: 0 0 24px rgba(255, 209, 102, 0.45);
      font-size: 22px;
      line-height: 1.35;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 8px;
      background: #b00020;
      color: white;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #ff1744;
    }

    button:disabled {
      background: #5f2a35;
      cursor: not-allowed;
      opacity: 0.8;
    }

    .page-link {
      width: fit-content;
      border-radius: 8px;
      border: 2px solid #ffd166;
      color: #fff8dc;
      padding: 10px 16px;
      text-decoration: none;
      font-weight: 700;
      background: rgba(48, 0, 24, 0.78);
    }

    .page-link:hover {
      background: #ffd166;
      color: #300018;
    }
  </style>
</head>
<body>
  <main>
    <h1>The Idea Dealer</h1>
    <p>Robot voice mode. Press any key or click the button to hear an idea.</p>
    <div id="idea" aria-live="polite">Welcome to The Idea Dealer table.</div>
    <button id="ideaButton" type="button">Reveal my card</button>
    <button id="connectButton" type="button">Connect Arduino</button>
    <a class="page-link" href="index.html">Idea table</a>
  </main>

  <script>
    const codingIdeas = [
      "Build a simple calculator app.",
      "Create a guess the number game.",
      "Make a digital pet that can eat, sleep, and play.",
      "Design a personal daily planner.",
      "Develop a text-based adventure game.",
      "Write a program that tells you a random fun fact.",
      "Make a weather dashboard.",
      "Build a habit tracker.",
      "Create a quiz game.",
      "Make a snake game.",
      "Build a random story generator.",
      "Create a typing speed tester.",
      "Make a password generator.",
      "Build a color palette creator.",
      "Create a school schedule organizer.",
      "Make a virtual pet simulator.",
      "Build a recipe recommendation app.",
      "Create a budget calculator.",
      "Make a movie review website.",
      "Build an AI study buddy."
    ];

    const ideaBox = document.querySelector("#idea");
    const ideaButton = document.querySelector("#ideaButton");
    const connectButton = document.querySelector("#connectButton");
    const revealCooldown = 4200;
    let isRevealing = false;
    let voices = [];
    let serialPort = null;

    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function say(message) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      loadVoices();
      const speech = new SpeechSynthesisUtterance(message);
      const englishVoice = voices.find((voice) => voice.lang && voice.lang.toLowerCase().startsWith("en"));

      if (englishVoice) {
        speech.voice = englishVoice;
      }

      speech.volume = 1;
      speech.rate = 1.12;
      speech.pitch = 0.95;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    }

    function setDealing(isDealing) {
      isRevealing = isDealing;
      ideaButton.disabled = isDealing;
      ideaButton.textContent = isDealing ? "Dealing..." : "Reveal my card";
    }

    function revealIdea() {
      if (isRevealing) {
        return;
      }

      setDealing(true);
      const index = Math.floor(Math.random() * codingIdeas.length);
      const message = `All right, player. Is this your card? Your idea is: ${codingIdeas[index]}`;

      ideaBox.textContent = message;
      say(message);

      window.setTimeout(() => setDealing(false), revealCooldown);
    }

    ideaButton.addEventListener("click", revealIdea);
    connectButton.addEventListener("click", connectArduino);

    window.addEventListener("keydown", (event) => {
      if (event.repeat) {
        return;
      }

      if (event.key.toLowerCase() === "q" || event.key === "Escape") {
        window.speechSynthesis.cancel();
        ideaBox.textContent = "The Idea Dealer is resting.";
        setDealing(false);
        return;
      }

      revealIdea();
    });

    ideaButton.addEventListener("click", () => {
      if (ideaBox.textContent === "Welcome to The Idea Dealer table.") {
        say("Ladies and gentlemen, welcome to The Idea Dealer table. Press a key, and I will reveal your idea.");
      }
    }, { once: true });

    async function connectArduino() {
      if (!("serial" in navigator)) {
        ideaBox.textContent = "Web Serial needs Chrome or Edge.";
        return;
      }

      try {
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 9600 });
        connectButton.disabled = true;
        connectButton.textContent = "Arduino connected";
        ideaBox.textContent = "Arduino connected. Press the robot button.";
        say("Arduino connected. Press the robot button.");
        readArduino();
      } catch (error) {
        ideaBox.textContent = "Arduino connection was canceled or failed.";
      }
    }

    async function readArduino() {
      const decoder = new TextDecoderStream();
      serialPort.readable.pipeTo(decoder.writable);
      const reader = decoder.readable.getReader();
      let buffer = "";

      try {
        while (true) {
          const { value, done } = await reader.read();

          if (done) {
            break;
          }

          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop();

          for (const line of lines) {
            if (line.trim().toLowerCase() === "idea") {
              revealIdea();
            }
          }
        }
      } catch (error) {
        ideaBox.textContent = "Arduino disconnected.";
        connectButton.disabled = false;
        connectButton.textContent = "Connect Arduino";
      }
    }
  </script>
</body>
</html>
